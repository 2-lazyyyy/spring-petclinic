services:
  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    image: petclinic-jenkins:2.568.3
    container_name: petclinic-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/jenkins.yaml"
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD}"
      PETCLINIC_REPO_URL: "${PETCLINIC_REPO_URL}"
      JAVA17_HOME: "/opt/java17"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./infra/jenkins/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/login > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - petclinic_ci

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: petclinic-jenkins-tunnel
    restart: "no"
    command: tunnel --protocol http2 --no-autoupdate --url http://jenkins:8080
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - petclinic_ci

volumes:
  jenkins_home:

networks:
  petclinic_ci:
    driver: bridge
